name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: python -m pytest -q
      - run: python tools/lint_spec.py spec/SPEC-2.0.0-draft.md spec/registers/evidence_gated.yaml
      - run: python tools/lint_spec.py spec/SPEC-2.0.0-draft-LEDGER.md spec/registers/evidence_gated.yaml
      - run: python tools/cut_draft.py --check
      - run: if [ -f spec/SPEC-2.0.0.md ]; then python tools/lint_spec.py spec/SPEC-2.0.0.md spec/registers/evidence_gated.yaml; fi
      - run: make freeze-dry-run
  freeze-status:
    # Informative only: expected to fail until OD-1x instantiates the EG registry (D-36).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python tools/freeze_check.py
        continue-on-error: true
