# Evidence-gated registry (RECON §4; D-36).
# Every entry blocks the 2.0.0 freeze until `instantiated: true` with a `value`,
# an `evidence` pointer (OD-1x sheet + row range) and a `date`.
# tools/freeze_check.py reads this file. tools/instantiate_eg.py fills it from OD-1x sheets.
#
# Fields:
#   key           threshold-set key (or named check)
#   provisional   value written in the draft until instantiated
#   instrument    what OD-1x measures
#   rule          how the value is derived from the measurement
#   instantiated  false until evidence lands
#   value         instantiated value (null until then)
#   evidence      path/rows of the sheet the value was derived from
#   date          ISO date of instantiation

registry_version: 1
source_protocol: protocols/OD-1x/PROTOCOL.md
