[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripstate"
version = "0.0.1"
description = "Vincennes attelé trip-state extraction pipeline (SPEC-2.0.0-draft)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "hypothesis>=6"]
cv = ["opencv-python", "numpy", "ultralytics", "scenedetect", "pandas", "pyarrow"]

[project.scripts]
tripstate = "tripstate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Preserve the existing compact mathematical/reference-code style. Tools bootstrap src on sys.path.
ignore = ["E702", "E741", "E743"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
