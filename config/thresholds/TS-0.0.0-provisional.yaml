# Threshold set TS-0.0.0-provisional — SPEC-2.0.0-draft §7.1
# This is NOT a calibrated set. Values are the spec's initial defaults.
# `eg: true` = evidence-gated: provisional until spec/registers/evidence_gated.yaml instantiates it.
# Modules read values through tripstate.config.ThresholdSet; never import numbers from here directly.

threshold_set_version: TS-0.0.0-provisional
spec_version: 2.0.0-draft
calibrated: false
search_provenance: null

geometry:
  sw_ratio: {value: 0.35, eg: true, used_in: "§2.1 (RP-5: may become per-shot)"}
  motion_window_s: {value: 0.4, used_in: "§3.1"}
  same_tier_sw: {value: 0.6, eg: true, used_in: "§2.2"}
  max_tier_span_sw: {value: 1.2, eg: true, used_in: "§2.2 (L-10)"}
  rail_lane_center_offset_sw: {value: 0.5, used_in: "§2.2"}
  rail_attach_sw: {value: 1.0, used_in: "§2.2 / EC-13"}
  rank_tie_sl: {value: 0.10, used_in: "§2.2 / §2.3"}
  cover_min_sl: {value: 0.3, used_in: "§2.2"}
  cover_max_sl: {value: 2.0, used_in: "§2.2"}
  cover_lat_sw: {value: 0.8, eg: true, used_in: "§2.2 (L-11, D-26)"}
  detach_sl: {value: 6.0, used_in: "§2.4 (value unchanged; OD-1x only confirms rarity, see detach_sl_prevalence)"}
  rail_ref_conf_min: {value: 0.5, used_in: "EC-13 (M4 namespaced rail-reference confidence; module default, tuned in §7)"}
  axis_min_vectors: {value: 3, used_in: "§3.1 motion-axis needs this many motion vectors (module default)"}
  axis_min_resultant: {value: 0.7, used_in: "§3.1 axial resultant length below which the motion axis is unstable -> PCA fallback"}
  axis_pca_conf: {value: 0.6, used_in: "§3.1 confidence assigned to PCA-fallback frames"}
  axis_trim_deg: {value: 45, used_in: "§3.1 outlier trim for motion vectors"}
  pack_min_visible: {value: 3, used_in: "§3 / EC-02 fewer visible runners -> conf 0"}
  axis_source: {value: motion, used_in: "§3.1 axis estimate: motion (runner displacements, biased by pan/zoom when the camera tracks well) or rail (rail-line direction prior; RP-22)"}
  vehicle_half_width_sw: {value: 0.5, used_in: "RP-23 foot-point correction in projective lateral mode (bbox bottom = near edge of the vehicle)"}
  lateral_scale_mode: {value: sw_ratio, used_in: "§3.2 lateral scale: sw_ratio (SW = SL·sw_ratio), rail_fence (linear two-line scale; wrong under strong perspective), rail_fence_projective (1-D projective lateral coordinate from rail, fence and their vanishing point; RP-19 refined)"}
  track_width_sl: {value: 5.8, eg: true, used_in: "RP-19 rail-to-fence width in sulky lengths (ASSUMED 25 m / 4.3 m; measure on a track plan or OD-1x)"}
  axis_min_vector_sl: {value: 0.05, used_in: "§3.1 displacements shorter than this fraction of SL are ignored for the motion axis (jitter guard)"}
  axis_smooth_s: {value: 1.0, used_in: "§3.1 time constant of the axis smoothing; RP-21 axis-accuracy requirement"}
  axis_neighbourhood_k: {value: 0, eg: true, used_in: "§3.1 principal axis fitted on k nearest runners (0 = whole pack); research 05 bends proposal"}

smoothing:
  min_state_s: {value: 1.0, used_in: "§3.4"}
  tier_hysteresis_s: {value: 0.6, used_in: "§3.4"}

confidence:
  min_state_conf: {value: 0.3, used_in: "§2.3"}
  ok_state_conf: {value: 0.6, used_in: "§2.4"}

events:
  recover_window_s: {value: 5.0, used_in: "§2.5"}
  break_match_tolerance_s: {value: 2.0, used_in: "§6.2 / M6"}

anchors:
  anchor_offset_volte_s: {value: 0.0, eg: true, used_in: "EC-12 (D-34)"}
  anchor_offset_autostart_s: {value: 0.0, eg: true, used_in: "EC-12 (D-34)"}
  anchor_tol_volte_s: {value: 2.0, eg: true, used_in: "EC-12 (D-34)"}
  anchor_tol_autostart_s: {value: 2.0, eg: true, used_in: "EC-12 (D-34)"}
  finish_evidence_min_k: {value: 3, eg: true, used_in: "M3 DoD (a) rung ii (D-30)"}

ingest:
  normalized_fps: {value: 25.0, eg: true, used_in: "M0"}
  time_unit_consistency_tol_s: {value: 0.5, used_in: "M0 rule 4"}
  plausible_km_rate_min_s: {value: 65, used_in: "M0 rule 4 (S-5: 55 -> 65)"}
  plausible_km_rate_max_s: {value: 110, used_in: "M0 rule 4"}

phases:
  early_phase_end: {value: 0.30, used_in: "§2.6"}
  late_phase_start: {value: 0.72, used_in: "§2.6"}

qc:
  coverage_race_min: {value: 0.65, eg: true, used_in: "Q-1"}
  coverage_final_third_min: {value: 0.70, eg: true, used_in: "Q-2"}
  graphic_occlusion_max: {value: 0.15, used_in: "Q-5 / EC-06"}
  occl_max_s: {value: 1.5, used_in: "EC-08"}
  human_budget_cap_min: {value: 8, eg: true, used_in: "Q-7 (D-29)"}
  max_field_size: {value: 14, used_in: "Q-6 (D-06)"}

yield:
  stratum_yield_review_factor: {value: 0.5, eg: true, used_in: "§6.2 per-stratum chartable trigger (D-35)"}

# Module-defined namespaces (§7.1): keys proposed from the research pack (docs/research/). Values are
# module defaults to be tuned in §7 calibration; they are NOT physics and NOT OD-1x evidence-gated.
m1_shots:
  cut_thresh: {value: 0.5, used_in: "TransNetV2 transition probability -> cut (research 03)"}
  type_margin_min: {value: 0.10, used_in: "CLIP top-1 vs top-2 margin below which shot type -> other"}
  min_shot_s: {value: 0.5, used_in: "shots shorter than this merge into neighbours before typing"}
  static_region_frames: {value: 75, used_in: "frames over which a pixel must be unchanged to count as graphic overlay"}
m2_detect:
  conf_min: {value: 0.25, used_in: "detector confidence floor"}
  nms_iou: {value: 0.7, used_in: "NMS IoU"}
  box_expand_sulky: {value: 1.6, used_in: "pilot only: expand a horse box rearward by this factor of its length to cover the sulky"}
m3_track:
  track_high_thresh: {value: 0.5, used_in: "first-association detection confidence (ByteTrack family)"}
  track_low_thresh: {value: 0.1, used_in: "second-association floor"}
  new_track_thresh: {value: 0.6, used_in: "confidence to start a new tracklet (production: new tracklets are flags, not identities)"}
  track_buffer_s: {value: 1.5, used_in: "coasting without support; MUST equal occl_max_s semantics (EC-08)"}
  match_thresh: {value: 0.8, used_in: "IoU/association threshold"}
  mask_conf_flag: {value: 0.5, used_in: "SAM2-propagated mask confidence below which the operator is flagged (research 02)"}
  mask_overlap_flag: {value: 0.5, used_in: "IoU between two runners' masks above which a swap is suspected"}
  overlap_flag_s: {value: 0.6, used_in: "duration of mask overlap before flagging"}
  lost_flag_s: {value: 0.2, used_in: "live seeding: frames without a box after a prompt before the operator is flagged (research 02)"}
m6_events:
  osc_window_s: {value: 1.0, used_in: "window for bbox vertical-oscillation statistics"}
  osc_change_z: {value: 3.0, used_in: "z-score of oscillation regime change that opens a candidate"}
  rank_vel_window_s: {value: 1.0, used_in: "window for longitudinal-rank velocity"}
  rank_vel_z: {value: 3.0, used_in: "z-score of rank-velocity anomaly"}
  candidate_merge_s: {value: 2.0, used_in: "candidates closer than this merge into one"}
