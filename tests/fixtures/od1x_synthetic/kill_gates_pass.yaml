# SYNTHETIC kill-gate statuses for the freeze dry run (tests/fixtures/od1x_synthetic). Not evidence.
gates:
  - id: KG-1
    name: seeding time
    rule: "median seeding time (first stable wide-pan frame -> all saddle numbers assigned) > 8 min"
    on_trigger: "stop; reconsider CV against pure hand-charting / text-parse"
    threshold_min: 8
    status: pass
    measured: 4.25
    evidence: "synthetic sheet_seeding.csv (3 races) via tools/pilot_report.py"
  - id: KG-2
    name: tier agreement
    rule: "M4 tier agreement < 0.85 on pilot hand-labelled frames"
    on_trigger: "recalibrate once; still failing -> stop"
    threshold: 0.85
    status: pass
    measured: 0.91
    evidence: "synthetic pilot reports (5) via tools/pilot_report.py"
  - id: KG-3
    name: pilot yield
    rule: "pilot chartable yield < 40%"
    on_trigger: "gate review before any further charting"
    threshold: 0.40
    status: pass
    measured: 0.8
    evidence: "synthetic pilot reports (5) via tools/pilot_report.py"
  - id: KG-4
    name: anchor residual spread
    rule: "post-offset anchor residual spread > 2 x provisional tolerance on either start type"
    on_trigger: "EC-12 design review before freeze"
    threshold_factor: 2.0
    status: pass
    measured: 0.12
    evidence: "synthetic sheet_anchors.csv via tools/pilot_report.py --anchors"
  - id: KG-5
    name: signal gate (RP-7, project-level, not a spec gate)
    rule: "notule trip phrases from prior races show no detectable edge vs closing odds on the owner's corpus"
    on_trigger: "stop or reframe before P4; the pipeline would be measuring something the market already prices"
    status: not_evaluated
    measured: null
    evidence: null
